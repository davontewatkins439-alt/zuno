[package]
name = "zuno-desktop"
version = "1.0.0"
description = "ZUNO — your city after dark"
authors = ["ZUNO"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zuno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
