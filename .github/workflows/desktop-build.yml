name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Also build the macOS installer"
        type: boolean
        default: true
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # NSIS produces ZUNO_<version>_x64-setup.exe. Add "msi" to the bundles list
      # ("--bundles nsis,msi") if you also want the WiX .msi installer.
      - name: Build ZUNO for Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--bundles nsis"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    name: macOS installer
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Only sign when a certificate is actually configured; an empty
      # APPLE_CERTIFICATE makes Tauri try (and fail) to import a PKCS#12.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build ZUNO for macOS (signed)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: "--target universal-apple-darwin --bundles dmg"

      - name: Build ZUNO for macOS (unsigned)
        if: env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--target universal-apple-darwin --bundles dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-macos-installers
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Two separate releases so visitors see a clear "for Windows" download and a
  # separate "for macOS" download, each with its own install instructions.
  publish:
    name: Publish releases
    needs: [windows, macos]
    if: always() && (needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ZUNO-*-installers
          path: release-assets
          merge-multiple: true
          if-no-files-found: ignore

      - name: Show what will be published
        run: find release-assets -type f -printf '%f %s bytes\n'

      - name: Publish Windows release
        if: hashFiles('release-assets/**/*.exe') != '' || hashFiles('release-assets/**/*.msi') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="desktop-v${VERSION}-win"
          cat > /tmp/windows.md <<EOF
          ## ZUNO ${VERSION} for Windows

          Download the **.exe** below and run it to install ZUNO.

          - Windows 10 or 11, 64-bit
          - Fresh install: opens on the ZUNO sign-in screen, then loads whatever account signs in on that PC from https://zunoo.freebuff.page
          - Unsigned build: if SmartScreen appears, choose **More info → Run anyway**

          Building for macOS instead? See the ZUNO ${VERSION} for macOS release.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ZUNO ${VERSION} for Windows" --notes-file /tmp/windows.md
          else
            gh release create "$TAG" --title "ZUNO ${VERSION} for Windows" --notes-file /tmp/windows.md
          fi
          find release-assets -type f \( -name '*.exe' -o -name '*.msi' \) -print0 | xargs -0 gh release upload "$TAG" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | .name + " (" + (.size|tostring) + " bytes)"'

      - name: Publish macOS release
        if: hashFiles('release-assets/**/*.dmg') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="desktop-v${VERSION}-mac"
          cat > /tmp/macos.md <<EOF
          ## ZUNO ${VERSION} for macOS

          Download the **.dmg** below, then:

          1. Open the downloaded **ZUNO_${VERSION}_universal.dmg**
          2. Drag **ZUNO** into the **Applications** folder shown in the window
          3. Open ZUNO from **Applications** or **Launchpad**

          One universal download runs on both Apple Silicon and Intel Macs (macOS 10.15 or newer).

          ### Starting fresh

          This download is a clean install — nothing is copied over from another computer or from the Windows app. On first launch ZUNO opens on its normal sign-in screen:

          - **Already have an account?** Sign in with your own email and password. Your own servers, DMs, badges and nameplates load from the live service.
          - **New here?** Choose sign-up and create an account right in the app.

          Each install signs in as whoever is using that Mac: nothing is pre-filled, and installing ZUNO never signs anyone into someone else's account.

          There is no local database to set up and no code to paste: ZUNO opens https://zunoo.freebuff.page inside its own window.

          **First launch is blocked by Gatekeeper** because this build is unsigned:

          - Right-click (or Control-click) **ZUNO** in Applications → **Open** → **Open** again, **or**
          - Run once in Terminal: \`sudo xattr -dr com.apple.quarantine /Applications/ZUNO.app\`

          After the first launch macOS remembers your choice.

          Building for Windows instead? See the ZUNO ${VERSION} for Windows release.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ZUNO ${VERSION} for macOS" --notes-file /tmp/macos.md
          else
            gh release create "$TAG" --title "ZUNO ${VERSION} for macOS" --notes-file /tmp/macos.md
          fi
          find release-assets -type f -name '*.dmg' -print0 | xargs -0 gh release upload "$TAG" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | .name + " (" + (.size|tostring) + " bytes)"'
