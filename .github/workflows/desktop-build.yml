name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Also build the macOS installer"
        type: boolean
        default: true
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # NSIS produces ZUNO_<version>_x64-setup.exe. Add "msi" to the bundles list
      # ("--bundles nsis,msi") if you also want the WiX .msi installer.
      - name: Build ZUNO for Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--bundles nsis"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    name: macOS installer
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build ZUNO for macOS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: "--target universal-apple-darwin --bundles dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-macos-installers
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # One release, both platforms, so Windows and macOS never race for the same tag.
  publish:
    name: Publish release
    needs: [windows, macos]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ZUNO-*-installers
          path: release-assets
          merge-multiple: true

      - name: Show what will be published
        run: ls -lh release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="desktop-v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "ZUNO $VERSION" \
              --notes "ZUNO desktop installers.

          - Windows 10/11 64-bit: ZUNO_${VERSION}_x64-setup.exe
          - macOS 10.15+ (Intel and Apple Silicon): Universal .dmg

          Unsigned builds — Windows SmartScreen and macOS Gatekeeper may warn.

          The desktop app is a native shell around https://zunoo.freebuff.page, so it uses the same account, servers, DMs and owner console as the website."
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | .name + " (" + (.size|tostring) + " bytes)"'
