name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Also build the macOS installers"
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # NSIS produces ZUNO_1.0.0_x64-setup.exe. Add "msi" to the bundles list
      # ("--bundles nsis,msi") if you also want the WiX .msi installer.
      # tauri-action also attaches the installer to a GitHub Release, which is the
      # file the website's download button links to.
      - name: Build ZUNO for Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "ZUNO __VERSION__ for Windows"
          releaseBody: |
            ## ZUNO __VERSION__ for Windows

            Download the **x64 setup .exe** below and run it to install ZUNO.

            - Windows 10 or 11, 64-bit
            - Signs in to https://zunoo.freebuff.page — same account, same servers, same DMs
            - Unsigned build: Windows SmartScreen may warn, choose **More info → Run anyway**
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: "--bundles nsis"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    name: macOS installer
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build ZUNO for macOS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: "--target universal-apple-darwin --bundles dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ZUNO-macos-installers
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
